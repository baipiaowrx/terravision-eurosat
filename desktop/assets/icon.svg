<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6bb5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a6dd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#409cff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="#111827" stroke="url(#grad1)" stroke-width="4"/>
  
  <!-- 地球轮廓 -->
  <ellipse cx="128" cy="128" rx="70" ry="70" fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- 经纬线 -->
  <ellipse cx="128" cy="128" rx="70" ry="35" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="128" cy="128" rx="35" ry="70" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  <line x1="58" y1="128" x2="198" y2="128" stroke="url(#grad2)" stroke-width="2" opacity="0.5"/>
  <line x1="128" y1="58" x2="128" y2="198" stroke="url(#grad2)" stroke-width="2" opacity="0.5"/>
  
  <!-- 卫星 -->
  <g transform="translate(180, 60) rotate(45)">
    <rect x="-8" y="-3" width="16" height="6" fill="url(#grad1)" rx="1"/>
    <rect x="-20" y="-1.5" width="12" height="3" fill="#6bb5ff" opacity="0.8"/>
    <rect x="8" y="-1.5" width="12" height="3" fill="#6bb5ff" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#409cff"/>
  </g>
  
  <!-- 卫星轨道 -->
  <ellipse cx="128" cy="128" rx="95" ry="40" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4" transform="rotate(-20, 128, 128)"/>
  
  <!-- 数据点/网格点 -->
  <circle cx="90" cy="100" r="3" fill="#4ade80" opacity="0.8"/>
  <circle cx="160" cy="110" r="3" fill="#4ade80" opacity="0.8"/>
  <circle cx="110" cy="150" r="3" fill="#4ade80" opacity="0.8"/>
  <circle cx="150" cy="160" r="3" fill="#4ade80" opacity="0.8"/>
  <circle cx="128" cy="128" r="4" fill="#ff9f0a" opacity="0.9"/>
  
  <!-- T字母 -->
  <text x="128" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#grad1)" filter="url(#glow)">T</text>
</svg>